<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>好き顔ランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f7f9;
      color: #222;
    }

    header {
      background: #fff;
      padding: 22px 16px 14px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .sub {
      color: #777;
      font-size: 13px;
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }

    .hidden {
      display: none !important;
    }

    .center {
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 13px 17px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .info {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .photo {
      position: relative;
      border: 3px solid transparent;
      border-radius: 16px;
      overflow: hidden;
      background: #eee;
      padding: 0;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .photo.selected {
      border-color: #222;
      transform: scale(0.98);
    }

    .photo img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }

    .photo .mark {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .photo.selected .mark {
      display: flex;
    }

    .progress {
      height: 7px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
      margin: 12px 0 16px;
    }

    .bar {
      height: 100%;
      background: #222;
      width: 0;
      transition: 0.2s;
    }

    .league {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .league button {
      padding: 0;
      background: white;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0,0,0,0.1);
    }

    .league img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }

    .league .label {
      padding: 11px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .resultGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .resultCard {
      background: #fff;
      border-radius: 18px;
      border: 1px solid #eee;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }

    .resultCard img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }

    .rankText {
      text-align: center;
      padding: 10px 5px 12px;
      font-size: 18px;
      font-weight: 900;
    }

    .top1 {
      font-size: 20px;
      font-weight: 900;
    }

    .score {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding-bottom: 10px;
    }

    @media (max-width: 500px) {
      main {
        padding: 11px;
      }

      .panel {
        padding: 14px;
      }

      .grid {
        gap: 7px;
      }

      .league {
        gap: 7px;
      }

      .resultGrid {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>♡ 好き顔ランキング</h1>
  <div class="sub">あなたが一番好きな顔を決めよう</div>
</header>

<main>

  <!-- ホーム -->
  <section id="home" class="panel center">

    <h2>好き顔ランキング</h2>

    <p class="info">
      写真の中から好きな顔を選んでください。<br>
      最後にあなた専用のランキングが決まります。
    </p>

    <button class="primary" id="startButton">
      ランキング開始
    </button>

  </section>


  <!-- 予選 -->
  <section id="qualify" class="panel hidden">

    <div>
      <b id="qualifyTitle">予選</b>
    </div>

    <div class="progress">
      <div id="qualifyBar" class="bar"></div>
    </div>

    <div class="info">
      この中から<strong>好きな写真を何枚でも選べます。</strong><br>
      1枚も選ばなくても次へ進めます。
    </div>

    <div id="qualifyGrid" class="grid"></div>

    <div class="actions">

      <button
        id="qualifyBack"
        class="secondary"
      >
        ← 1つ前
      </button>

      <button
        id="qualifyNext"
        class="primary"
      >
        選択を決定
      </button>

    </div>

  </section>


  <!-- 予選通過リーグ -->
  <section id="league" class="panel hidden">

    <div>
      <b id="leagueTitle">予選通過リーグ</b>
    </div>

    <p class="info">
      3枚の中から<strong>一番好きな1枚</strong>を選んでください。
    </p>

    <p class="info">
      予選を通過した写真は何度も登場します。<br>
      できるだけ他の通過写真とも比較されます。
    </p>

    <div class="progress">
      <div id="leagueBar" class="bar"></div>
    </div>

    <div id="leagueGrid" class="league"></div>

    <div class="actions">

      <button
        id="leagueBack"
        class="secondary"
      >
        ← 1つ前
      </button>

    </div>

  </section>


  <!-- 結果 -->
  <section id="result" class="panel hidden">

    <div class="center">

      <div class="top1">
        🏆 あなたの好き顔ランキング
      </div>

      <p class="info">
        あなたが選んだ結果です
      </p>

    </div>

    <div id="ranking" class="resultGrid"></div>

    <div class="actions">

      <button
        id="resultBack"
        class="secondary"
      >
        ← リーグに戻る
      </button>

      <button
        id="retry"
        class="primary"
      >
        もう一度やる
      </button>

    </div>

  </section>

</main>


<script>

  /* =========================
     写真
  ========================= */

  const PHOTO_FILES = [

    "IMG_2717.jpeg",
    "IMG_2718.jpeg",
    "IMG_2719.jpeg",
    "IMG_2720.jpeg",
    "IMG_2722.jpeg",
    "IMG_2723.jpeg",
    "IMG_2724.jpeg",
    "IMG_2725.jpeg",
    "IMG_2726.jpeg",
    "IMG_2727.jpeg",
    "IMG_2729.jpeg",
    "IMG_2730.jpeg",
    "IMG_2731.jpeg",
    "IMG_2732.jpeg",
    "IMG_2733.jpeg",
    "IMG_2734.jpeg",
    "IMG_2735.jpeg",
    "IMG_2736.jpeg",
    "IMG_2737.jpeg",
    "IMG_2738.jpeg",
    "IMG_2739.jpeg",
    "IMG_2740.jpeg",
    "IMG_2741.jpeg",
    "IMG_2742.jpeg",
    "IMG_2743.jpeg",
    "IMG_2744.jpeg",
    "IMG_2745.jpeg",
    "IMG_2746.jpeg",
    "IMG_2747.jpeg",
    "IMG_2748.jpeg",
    "IMG_2749.jpeg",
    "IMG_2750.jpeg",
    "IMG_2751.jpeg",
    "IMG_2752.jpeg",
    "IMG_2753.jpeg",
    "IMG_2754.jpeg",
    "IMG_2755.jpeg",
    "IMG_2756.jpeg",
    "IMG_2757.jpeg",
    "IMG_2758.jpeg",
    "IMG_2759.jpeg",
    "IMG_2760.jpeg",
    "IMG_2762.jpeg",
    "IMG_2763.jpeg",
    "IMG_2764.jpeg",
    "IMG_2765.jpeg",
    "IMG_2766.jpeg",
    "IMG_2767.jpeg",
    "IMG_2768.jpeg",
    "IMG_2769.jpeg",
    "IMG_2770.jpeg"

  ];


  /* =========================
     状態
  ========================= */

  const state = {

    photos: [],

    qualifyGroups: [],

    qualifyIndex: 0,

    qualifySelections: [],

    finalists: [],

    leagueMatches: [],

    leagueIndex: 0,

    leagueHistory: [],

    wins: {},

    result: []

  };


  const $ = (id) =>
    document.getElementById(id);


  /* =========================
     写真読み込み
  ========================= */

  function loadPhotos() {

    state.photos =
      PHOTO_FILES.map((file, index) => ({

        id: index,

        file: file,

        url: file

      }));

  }


  /* =========================
     シャッフル
  ========================= */

  function shuffle(arr) {

    const copy = [...arr];

    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [copy[i], copy[j]] =
        [copy[j], copy[i]];

    }

    return copy;

  }


  /* =========================
     予選グループ作成
     必ず5～6枚
  ========================= */

  function createQualifyGroups() {

    const shuffled =
      shuffle(state.photos);

    const groups = [];

    let remaining =
      shuffled.length;

    let index = 0;

    while (remaining > 0) {

      let size;

      /*
       * 残りが5～6ならそのまま
       */
      if (remaining <= 6) {

        size = remaining;

        /*
         * 4枚になってしまう場合は
         * 前のグループから1枚移して
         * 5枚＋5枚などにする
         */
        if (size < 5) {

          const last =
            groups[groups.length - 1];

          if (last && last.length > 5) {

            const moved =
              last.pop();

            const group =
              shuffled.slice(
                index,
                index + size
              );

            group.push(moved);

            groups.push(group);

            index += size;

            remaining = 0;

            continue;

          }

        }

      } else {

        size =
          Math.random() < 0.5
            ? 5
            : 6;

      }

      groups.push(
        shuffled.slice(
          index,
          index + size
        )
      );

      index += size;

      remaining -= size;

    }

    return groups;

  }


  /* =========================
     予選開始
  ========================= */

  function startQualify() {

    state.qualifyGroups =
      createQualifyGroups();

    state.qualifyIndex = 0;

    state.qualifySelections =
      [];

    state.finalists = [];

    $("home")
      .classList
      .add("hidden");

    $("qualify")
      .classList
      .remove("hidden");

    showQualify();

  }


  /* =========================
     予選表示
  ========================= */

  function showQualify() {

    const group =
      state.qualifyGroups[
        state.qualifyIndex
      ];

    if (!group) {

      startLeague();

      return;

    }

    $("qualifyTitle")
      .textContent =
      `予選 ${state.qualifyIndex + 1} / ${state.qualifyGroups.length}`;

    $("qualifyBar")
      .style.width =
      `${(state.qualifyIndex / state.qualifyGroups.length) * 100}%`;


    const saved =
      state.qualifySelections[
        state.qualifyIndex
      ] || [];


    $("qualifyGrid").innerHTML =

      group.map(p => `

        <button
          class="photo ${saved.includes(p.id) ? "selected" : ""}"
          data-id="${p.id}"
          onclick="toggleSelect(${p.id})"
        >

          <img src="${p.url}">

          <span class="mark">
            ✓
          </span>

        </button>

      `).join("");

  }


  /* =========================
     予選選択
  ========================= */

  window.toggleSelect = function(id) {

    if (
      !state.qualifySelections[
        state.qualifyIndex
      ]
    ) {

      state.qualifySelections[
        state.qualifyIndex
      ] = [];

    }

    const selected =
      state.qualifySelections[
        state.qualifyIndex
      ];


    if (selected.includes(id)) {

      state.qualifySelections[
        state.qualifyIndex
      ] =
        selected.filter(
          x => x !== id
        );

    } else {

      selected.push(id);

    }


    showQualify();

  };


  /* =========================
     予選 次へ
  ========================= */

  $("qualifyNext")
    .addEventListener(
      "click",
      () => {

        if (
          state.qualifyIndex <
          state.qualifyGroups.length - 1
        ) {

          state.qualifyIndex++;

          showQualify();

        } else {

          collectFinalists();

          startLeague();

        }

      }
    );


  /* =========================
     予選 戻る
  ========================= */

  $("qualifyBack")
    .addEventListener(
      "click",
      () => {

        if (
          state.qualifyIndex > 0
        ) {

          state.qualifyIndex--;

          showQualify();

        } else {

          $("qualify")
            .classList
            .add("hidden");

          $("home")
            .classList
            .remove("hidden");

        }

      }
    );


  /* =========================
     予選通過者を確定
  ========================= */

  function collectFinalists() {

    const ids = [];

    state.qualifySelections
      .forEach(group => {

        group.forEach(id => {

          if (!ids.includes(id)) {

            ids.push(id);

          }

        });

      });


    state.finalists =
      ids.map(id =>
        state.photos.find(
          p => p.id === id
        )
      ).filter(Boolean);

  }


  /* =========================
     リーグ対戦を作る
     
     なるべく全員と比較する
     1人あたり複数回登場
  ========================= */

  function createLeagueMatches() {

    const players =
      shuffle([
        ...state.finalists
      ]);


    const n =
      players.length;


    if (n < 3) {

      return [];

    }


    const matches = [];

    const used = new Set();


    /*
     * まず全員が他の人と
     * できるだけ対戦できるように
     * 3人組を作る
     */

    const targetAppearances =
      Math.max(
        4,
        Math.min(6, n - 1)
      );


    const appearances = {};

    players.forEach(p => {
      appearances[p.id] = 0;
    });


    /*
     * 3人組を作っていく
     */

    let safety = 0;

    while (
      Math.min(
        ...players.map(
          p => appearances[p.id]
        )
      ) < targetAppearances &&
      safety < 1000
    ) {

      safety++;


      const candidates =
        [...players].sort(
          (a, b) =>
            appearances[a.id] -
            appearances[b.id]
        );


      let made = false;


      /*
       * 出現回数の少ない人を
       * 優先して3人選ぶ
       */

      for (
        let a = 0;
        a < candidates.length;
        a++
      ) {

        for (
          let b = a + 1;
          b < candidates.length;
          b++
        ) {

          for (
            let c = b + 1;
            c < candidates.length;
            c++
          ) {

            const group = [
              candidates[a],
              candidates[b],
              candidates[c]
            ];


            const ids =
              group
                .map(p => p.id)
                .sort(
                  (x, y) => x - y
                );


            const key =
              ids.join("-");


            /*
             * 同じ3人組を
             * なるべく繰り返さない
             */

            if (
              !used.has(key)
            ) {

              used.add(key);

              matches.push(
                shuffle(group)
              );

              group.forEach(p => {

                appearances[p.id]++;

              });

              made = true;

              break;

            }

          }

          if (made) break;

        }

        if (made) break;

      }


      /*
       * 全組み合わせを使い切った場合
       * 繰り返しも許可
       */

      if (!made) {

        const group =
          shuffle(players).slice(0, 3);

        matches.push(group);

        group.forEach(p => {

          appearances[p.id]++;

        });

      }

    }


    return shuffle(matches);

  }


  /* =========================
     リーグ開始
  ========================= */

  function startLeague() {

    $("qualify")
      .classList
      .add("hidden");


    /*
     * 予選で誰も選ばなかった場合
     */

    if (
      state.finalists.length === 0
    ) {

      showFinalResult([]);

      return;

    }


    /*
     * 1～2枚だけなら
     * 3枚対戦ができないため
     * そのままランキング
     */

    if (
      state.finalists.length < 3
    ) {

      state.result =
        [...state.finalists];

      showFinalResult(
        state.result
      );

      return;

    }


    state.leagueMatches =
      createLeagueMatches();


    state.leagueIndex = 0;

    state.leagueHistory = [];

    state.wins = {};


    state.finalists.forEach(p => {

      state.wins[p.id] = 0;

    });


    $("league")
      .classList
      .remove("hidden");


    showLeague();

  }


  /* =========================
     リーグ表示
  ========================= */

  function showLeague() {

    if (
      state.leagueIndex >=
      state.leagueMatches.length
    ) {

      finishLeague();

      return;

    }


    const group =
      state.leagueMatches[
        state.leagueIndex
      ];


    $("leagueTitle")
      .textContent =
      `予選通過リーグ ${state.leagueIndex + 1} / ${state.leagueMatches.length}`;


    $("leagueBar")
      .style.width =
      `${(state.leagueIndex / state.leagueMatches.length) * 100}%`;


    $("leagueGrid").innerHTML =

      group.map(p => `

        <button
          onclick="chooseLeague(${p.id})"
        >

          <img src="${p.url}">

          <div class="label">
            選ぶ
          </div>

        </button>

      `).join("");

  }


  /* =========================
     リーグ選択
  ========================= */

  window.chooseLeague =
    function(id) {

      /*
       * 戻ったときに
       * 勝敗を取り消せるように
       * 履歴を保存
       */

      state.leagueHistory.push({

        matchIndex:
          state.leagueIndex,

        selectedId:
          id

      });


      state.wins[id] =
        (state.wins[id] || 0) + 1;


      state.leagueIndex++;


      showLeague();

    };


  /* =========================
     リーグ 戻る
  ========================= */

  $("leagueBack")
    .addEventListener(
      "click",
      () => {

        if (
          state.leagueHistory.length === 0
        ) {

          $("league")
            .classList
            .add("hidden");

          $("qualify")
            .classList
            .remove("hidden");

          state.qualifyIndex =
            state.qualifyGroups.length - 1;

          showQualify();

          return;

        }


        const last =
          state.leagueHistory.pop();


        /*
         * 直前の勝利を取り消す
         */

        state.wins[
          last.selectedId
        ]--;

        state.leagueIndex =
          last.matchIndex;


        showLeague();

      }
    );


  /* =========================
     リーグ終了
  ========================= */

  function finishLeague() {

    $("league")
      .classList
      .add("hidden");


    const sorted =
      [...state.finalists].sort(
        (a, b) => {

          const winDiff =
            (state.wins[b.id] || 0) -
            (state.wins[a.id] || 0);

          if (winDiff !== 0) {

            return winDiff;

          }

          return Math.random() - 0.5;

        }
      );


    state.result =
      sorted.slice(
        0,
        Math.min(9, sorted.length)
      );


    showFinalResult(
      state.result
    );

  }


  /* =========================
     結果表示
  ========================= */

  function showFinalResult(result) {

    $("result")
      .classList
      .remove("hidden");


    $("ranking").innerHTML =

      result.map((p, i) => {

        const rank =
          i + 1;


        const wins =
          state.wins[p.id] || 0;


        return `

          <div class="resultCard">

            <img src="${p.url}">

            <div class="rankText">
              ${rank}位
            </div>

            ${
              state.finalists.length >= 3
              ? `<div class="score">
                   勝利 ${wins}回
                 </div>`
              : ""
            }

          </div>

        `;

      }).join("");


    if (
      result.length === 0
    ) {

      $("ranking").innerHTML = `

        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:30px;
          "
        >

          <b>
            今回は写真が選ばれませんでした
          </b>

          <p class="info">
            もう一度ランキングを開始してください。
          </p>

        </div>

      `;

    }

  }


  /* =========================
     結果 → リーグ
  ========================= */

  $("resultBack")
    .addEventListener(
      "click",
      () => {

        if (
          state.finalists.length < 3
        ) {

          return;

        }


        $("result")
          .classList
          .add("hidden");


        $("league")
          .classList
          .remove("hidden");


        showLeague();

      }
    );


  /* =========================
     最初から
  ========================= */

  $("retry")
    .addEventListener(
      "click",
      () => {

        $("result")
          .classList
          .add("hidden");

        $("league")
          .classList
          .add("hidden");

        $("qualify")
          .classList
          .add("hidden");

        $("home")
          .classList
          .remove("hidden");


        loadPhotos();

      }
    );


  /* =========================
     開始
  ========================= */

  $("startButton")
    .addEventListener(
      "click",
      () => {

        if (
          state.photos.length < 3
        ) {

          alert(
            "写真を3枚以上登録してください。"
          );

          return;

        }


        startQualify();

      }
    );


  loadPhotos();

</script>

</body>
</html>
