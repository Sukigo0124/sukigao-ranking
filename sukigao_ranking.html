<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>好き顔ランキング</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f7f7f9;
      color: #222;
    }
    header {
      background: #fff;
      padding: 22px 16px 14px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    h1 { margin: 0 0 6px; font-size: 25px; }
    .sub { color: #777; font-size: 13px; }
    main {
      max-width: 760px;
      margin: auto;
      padding: 16px;
    }
    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }
    .hidden { display: none !important; }
    button {
      border: 0;
      border-radius: 13px;
      padding: 13px 17px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: #222;
      color: #fff;
    }
    .info {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .photo {
      position: relative;
      border: 3px solid transparent;
      border-radius: 16px;
      overflow: hidden;
      background: #eee;
      padding: 0;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    .photo.selected {
      border-color: #222;
      transform: scale(0.98);
    }
    .photo img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }
    .photo .mark {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .photo.selected .mark { display: flex; }
    .progress {
      height: 7px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
      margin: 12px 0 16px;
    }
    .bar {
      height: 100%;
      background: #222;
      width: 0;
      transition: 0.2s;
    }
    .league {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .league button {
      padding: 0;
      background: white;
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0,0,0,0.1);
    }
    .league img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }
    .league .label {
      padding: 11px;
    }
    .resultGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .resultCard {
      position: relative;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #eee;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
    }
    .resultCard img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }
    .rankBadge {
      position: absolute;
      top: 10px;
      left: 10px;
      min-width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      border: 2px solid rgba(255,255,255,0.7);
    }
    .resultInfo {
      padding: 12px 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.95));
    }
    .resultInfo strong {
      font-size: 18px;
      line-height: 1.2;
    }
    .resultInfo .small {
      color: #666;
      font-size: 12px;
      font-weight: 700;
    }
    .resultScore {
      color: #222;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .top1 { font-size: 20px; font-weight: 900; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    @media (max-width: 500px) {
      main { padding: 11px; }
      .panel { padding: 14px; }
      .grid { gap: 7px; }
      .league { gap: 7px; }
      .resultGrid { gap: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>♡ 好き顔ランキング</h1>
    <div class="sub">あなたが一番好きな顔を決めよう</div>
  </header>

  <main>
    <section id="home" class="panel center">
      <h2>好き顔ランキング</h2>
      <p class="info">
        写真の中から好きな顔を選んでください。<br>
        最後にあなた専用のランキングが決まります。
      </p>
      <button class="primary" id="startButton">ランキング開始</button>
    </section>

    <section id="qualify" class="panel hidden">
      <div><b id="qualifyTitle">予選</b></div>
      <div class="progress"><div id="qualifyBar" class="bar"></div></div>
      <div class="info">この中から<strong>好きな写真を選んでください。</strong>選ばなくても進めます。</div>
      <div id="qualifyGrid" class="grid"></div>
      <div class="actions">
        <button id="qualifyNext" class="primary">選択を決定</button>
      </div>
    </section>

    <section id="league" class="panel hidden">
      <div><b>予選通過リーグ</b></div>
      <p class="info">3枚の中から、<strong>一番好きな1枚</strong>を選んでください。</p>
      <div class="progress"><div id="leagueBar" class="bar"></div></div>
      <div id="leagueGrid" class="league"></div>
    </section>

    <section id="result" class="panel hidden">
      <div class="center">
        <div class="top1">🏆 あなたの好き顔ランキング</div>
        <p class="info">あなたが選んだ結果です</p>
      </div>
      <div id="ranking" class="resultGrid"></div>
      <div class="actions">
        <button id="retry" class="primary">もう一度やる</button>
      </div>
    </section>
  </main>

  <script>
    const PHOTO_FILES = [
      "IMG_2717.jpeg",
      "IMG_2718.jpeg",
      "IMG_2719.jpeg",
      "IMG_2720.jpeg",
      "IMG_2722.jpeg",
      "IMG_2723.jpeg",
      "IMG_2724.jpeg",
      "IMG_2725.jpeg",
      "IMG_2726.jpeg",
      "IMG_2727.jpeg",
      "IMG_2729.jpeg",
      "IMG_2730.jpeg",
      "IMG_2731.jpeg",
      "IMG_2732.jpeg",
      "IMG_2733.jpeg",
      "IMG_2734.jpeg",
      "IMG_2735.jpeg",
      "IMG_2736.jpeg",
      "IMG_2737.jpeg",
      "IMG_2738.jpeg",
      "IMG_2739.jpeg",
      "IMG_2740.jpeg",
      "IMG_2741.jpeg",
      "IMG_2742.jpeg",
      "IMG_2743.jpeg",
      "IMG_2744.jpeg",
      "IMG_2745.jpeg",
      "IMG_2746.jpeg",
      "IMG_2747.jpeg",
      "IMG_2748.jpeg",
      "IMG_2749.jpeg",
      "IMG_2750.jpeg",
      "IMG_2751.jpeg",
      "IMG_2752.jpeg",
      "IMG_2753.jpeg",
      "IMG_2754.jpeg",
      "IMG_2755.jpeg",
      "IMG_2756.jpeg",
      "IMG_2757.jpeg",
      "IMG_2758.jpeg",
      "IMG_2759.jpeg",
      "IMG_2760.jpeg",
      "IMG_2762.jpeg",
      "IMG_2763.jpeg",
      "IMG_2764.jpeg",
      "IMG_2765.jpeg",
      "IMG_2766.jpeg",
      "IMG_2767.jpeg",
      "IMG_2768.jpeg",
      "IMG_2769.jpeg",
      "IMG_2770.jpeg"
    ];

    const state = {
      photos: [],
      qualifyGroups: [],
      qualifyIndex: 0,
      selected: [],
      finalists: [],
      leagueMatches: [],
      leagueIndex: 0,
      wins: {}
    };

    const $ = (id) => document.getElementById(id);

    function loadPhotos() {
      state.photos = PHOTO_FILES.map((file, index) => ({
        id: index,
        file,
        url: file,
        wins: 0
      }));
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startQualify() {
      state.qualifyGroups = [];
      state.qualifyIndex = 0;
      state.finalists = [];
      state.selected = [];

      const shuffled = shuffle(state.photos);
      let i = 0;

      while (i < shuffled.length) {
        const remaining = shuffled.length - i;
        let size;

        if (remaining <= 6) {
          size = remaining;

          if (size < 5 && state.qualifyGroups.length) {
            const last = state.qualifyGroups[state.qualifyGroups.length - 1];
            if (last.length > 5) {
              const moved = last.pop();
              const nextGroup = shuffled.slice(i, i + 1);
              nextGroup.push(moved);
              state.qualifyGroups.push(nextGroup);
              i += 1;
              continue;
            }
          }
        } else {
          size = Math.random() < 0.5 ? 5 : 6;
        }

        state.qualifyGroups.push(shuffled.slice(i, i + size));
        i += size;
      }

      $("home").classList.add("hidden");
      $("qualify").classList.remove("hidden");
      showQualify();
    }

    function showQualify() {
      state.selected = [];
      const group = state.qualifyGroups[state.qualifyIndex];

      $("qualifyTitle").textContent = `予選 ${state.qualifyIndex + 1} / ${state.qualifyGroups.length}`;
      $("qualifyBar").style.width = `${(state.qualifyIndex / state.qualifyGroups.length) * 100}%`;

      $("qualifyGrid").innerHTML = group.map((p) => `
        <button class="photo" data-id="${p.id}" onclick="toggleSelect(${p.id})">
          <img src="${p.url}">
          <span class="mark">✓</span>
        </button>
      `).join("");
    }

    window.toggleSelect = (id) => {
      const button = document.querySelector(`.photo[data-id="${id}"]`);

      if (state.selected.includes(id)) {
        state.selected = state.selected.filter((x) => x !== id);
        button.classList.remove("selected");
      } else {
        state.selected.push(id);
        button.classList.add("selected");
      }
    };

    $("startButton").addEventListener("click", () => {
      if (state.photos.length < 3) {
        alert("写真を3枚以上登録してください。");
        return;
      }
      startQualify();
    });

    $("qualifyNext").addEventListener("click", () => {
      state.selected.forEach((id) => {
        const photo = state.photos.find((p) => p.id === id);
        if (photo && !state.finalists.includes(photo)) {
          state.finalists.push(photo);
        }
      });

      state.qualifyIndex += 1;

      if (state.qualifyIndex < state.qualifyGroups.length) {
        showQualify();
      } else {
        startLeague();
      }
    });

    function startLeague() {
      $("qualify").classList.add("hidden");

      if (state.finalists.length === 0) {
        state.finalists = [...state.photos].slice(0, Math.min(9, state.photos.length));
      }

      if (state.finalists.length === 1) {
        showFinalResult(state.finalists);
        return;
      }

      state.leagueMatches = [];
      const shuffled = shuffle(state.finalists);

      for (let i = 0; i < shuffled.length; i += 3) {
        const group = shuffled.slice(i, i + 3);

        if (group.length === 2) {
          const previous = state.leagueMatches[state.leagueMatches.length - 1];
          if (previous && previous.length === 3) {
            group.push(previous.pop());
          }
        }

        state.leagueMatches.push(group);
      }

      state.leagueIndex = 0;
      state.wins = {};
      state.finalists.forEach((p) => {
        state.wins[p.id] = 0;
      });

      $("league").classList.remove("hidden");
      showLeague();
    }

    function showLeague() {
      if (state.leagueIndex >= state.leagueMatches.length) {
        finishLeague();
        return;
      }

      const group = state.leagueMatches[state.leagueIndex];
      $("leagueBar").style.width = `${(state.leagueIndex / state.leagueMatches.length) * 100}%`;

      $("leagueGrid").innerHTML = group.map((p) => `
        <button onclick="chooseLeague(${p.id})">
          <img src="${p.url}">
          <div class="label">選ぶ</div>
        </button>
      `).join("");
    }

    window.chooseLeague = (id) => {
      state.wins[id] = (state.wins[id] || 0) + 1;
      state.leagueIndex += 1;
      showLeague();
    };

    function finishLeague() {
      $("league").classList.add("hidden");

      const sorted = [...state.finalists].sort((a, b) => (state.wins[b.id] || 0) - (state.wins[a.id] || 0));
      showFinalResult(sorted.slice(0, Math.min(9, sorted.length)));
    }

    function showFinalResult(result) {
      $("result").classList.remove("hidden");
      $("ranking").innerHTML = result.map((p, i) => {
        const rankText = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1;
        const score = state.wins?.[p.id] ?? 0;

        return `
          <div class="resultCard">
            <div class="rankBadge">${rankText}</div>
            <img src="${p.url}">
            <div class="resultInfo">
              <div>
                <strong>${i + 1}位</strong>
                <div class="small">${i === 0 ? "一番好き♡" : "投票結果"}</div>
              </div>
              <div class="resultScore">${score}勝</div>
            </div>
          </div>
        `;
      }).join("");
    }

    $("retry").addEventListener("click", () => {
      $("result").classList.add("hidden");
      $("home").classList.remove("hidden");
      loadPhotos();
    });

    loadPhotos();
  </script>
</body>
</html>
